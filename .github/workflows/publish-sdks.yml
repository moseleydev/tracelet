name: Publish SDKs

# Tag sdk-node-v0.1.0 or sdk-python-v0.1.0 to publish that SDK. The tag must
# match the version in package.json / pyproject.toml.
on:
  push:
    tags: ["sdk-node-v*", "sdk-python-v*"]

jobs:
  node:
    if: startsWith(github.ref_name, 'sdk-node-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing: no token stored, provenance included
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # trusted publishing needs Node 22.14+ and npm 11.5.1+
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "sdk-node-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm publish --access public

  python:
    if: startsWith(github.ref_name, 'sdk-python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing: no token stored
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches pyproject.toml
        run: test "sdk-python-v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: python -m unittest discover -s tests
      - run: pip install build==1.2.2 && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
