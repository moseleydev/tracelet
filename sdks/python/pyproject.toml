[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelet-sdk"
version = "0.1.0"
description = "Tag your database queries with the request that ran them, so Tracelet can show per-request waterfalls and catch N+1 loops."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = []
keywords = ["tracelet", "sqlcommenter", "postgres", "database", "performance", "n+1"]

[project.urls]
Homepage = "https://github.com/moseleydev/tracelet"

[tool.setuptools]
packages = ["tracelet_sdk"]
